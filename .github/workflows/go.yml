name: Go
run-name: ${{ github.actor }} is building 🔧
# Never runs on push or pull request: the Release workflow calls it on the
# commit it is about to tag, and it can be run by hand from the Actions tab.
on:
  workflow_dispatch:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.5'
    - name: Checkout code
      uses: actions/checkout@v7
    # Tests + crap4go gate in one run; crap4go writes the coverage profile.
    - name: Run tests + CRAP gate
      run: make crap CRAP_TEST_CMD="go test -race -shuffle on -timeout 1m ./..."
    - name: Send coverage 
      uses: shogo82148/actions-goveralls@v1
      with:
        path-to-profile: target/coverage/coverage.out
